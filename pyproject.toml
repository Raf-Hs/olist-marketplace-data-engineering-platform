[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: test needs raw/silver data files",
    "integration: integration test requiring database",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
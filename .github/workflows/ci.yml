name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: olist_dw
          POSTGRES_USER: olist_user
          POSTGRES_PASSWORD: OlistDev_2026_Local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist_user -d olist_dw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: olist_dw
      POSTGRES_USER: olist_user
      POSTGRES_PASSWORD: OlistDev_2026_Local
      PROJECT_ROOT: ${{ github.workspace }}
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Run unit tests
        run: pytest -q -m "not requires_data"
      - name: Run data-dependent tests (if data present)
        run: |
          if [ -f data/silver/customers/customers.parquet ]; then
            pytest -q -m "requires_data"
          else
            echo "Skipping data-dependent tests: no source data in CI"
          fi